<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="pass.css">
</head>
<body>
<span class="badge">Inputs · Password</span>
<div class="pw" id="pw">
  <p class="lab">Create a password</p>
  <div class="field"><input id="inp" type="password" autocomplete="new-password" spellcheck="false" aria-label="Password" aria-describedby="word">
    <button class="eye" id="eye" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path class="lid" id="lid" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle id="pupil" cx="12" cy="12" r="2.8"/><path id="slash" d="M4.5 4.5l15 15"/></svg></button></div>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
  <div class="foot"><span class="word" id="word">Too short</span><span class="rules" id="rules">8+ chars, a number, a symbol</span></div>
</div>
<script src="../shared/motion.js"></script>
<script src="pass.js"></script>
</body>
</html>
